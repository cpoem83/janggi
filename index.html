:root{
  color-scheme:dark;
  --ink:#17110c; --ink2:#221913; --ink3:#2e2219; --line:#4a3727;
  --paper:#f1e6d0; --muted:#b9a88d; --gold:#d9a54c; --gold-ink:#2a1c0e;
  --han:#c42a1f; --cho:#1f55ad;
  --han-ink:#ad1d13; --cho-ink:#163f92;
  --ui:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --disp:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --kai:"JGKai","Kaiti TC","BiauKai","DFKai-SB",serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0}
body{background:radial-gradient(120% 80% at 50% 45%,#2a1f16 0%,var(--ink) 70%);color:var(--paper);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ── bars ── */
.bar{display:flex;align-items:center;gap:10px;padding-block:8px;padding-inline:16px;min-height:58px;position:relative}
.bar.flip{transform:rotate(180deg)}
.bar .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.bar .meta{display:flex;flex-direction:column;min-width:0;gap:2px}
.bar .nm{font-family:var(--disp);font-weight:700;font-size:16px;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.bar .nm small{font-family:var(--ui);font-weight:400;font-size:12px;color:var(--muted)}
.bar .sc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar .tray{display:flex;gap:2px;overflow:hidden;min-width:0;flex:0 1 auto;height:26px;align-items:center}
.bar .chip{font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--gold);color:var(--gold-ink);white-space:nowrap;visibility:hidden}
.bar.turn .chip{visibility:visible}
.bar.turn.think .chip{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.bar::after{content:"";position:absolute;left:16px;right:16px;height:2px;background:transparent;transition:background .3s}
#barTop::after{bottom:0} #barBot::after{top:0}
.bar.flip::after{bottom:auto;top:0}
.bar.turn.han::after{background:var(--han)} .bar.turn.cho::after{background:var(--cho)}
.btns{display:flex;gap:6px;flex:none}
.btn{background:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.35;cursor:default}
@media (max-width:460px){.bar .tray{display:none}.btn{padding:7px 8px;font-size:12px}.bar{gap:8px}}

/* ── board ── */
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-inline:8px}
#board{position:relative;border-radius:calc(var(--u)*.12);box-shadow:0 calc(var(--u)*.18) 0 #6d4019,0 calc(var(--u)*.18) 0 1px #4d2b10,0 calc(var(--u)*.5) calc(var(--u)*.9) rgba(0,0,0,.55);touch-action:manipulation;user-select:none;-webkit-user-select:none}
#grain,#lines,#marks,#pieces{position:absolute;inset:0;width:100%;height:100%}
#grain{border-radius:inherit}
#marks,#pieces{pointer-events:none}
.dot,.cap,.last{position:absolute;transform:translate(-50%,-50%);border-radius:50%}
.dot{width:calc(var(--u)*.26);height:calc(var(--u)*.26);background:rgba(40,110,60,.8);box-shadow:0 0 0 2px rgba(240,230,200,.55)}
.cap{width:calc(var(--u)*1.02);height:calc(var(--u)*1.02);border:3px solid rgba(40,130,70,.9);z-index:40}
.last{width:calc(var(--u)*.9);height:calc(var(--u)*.9);background:rgba(255,236,170,.28);border:2px dashed rgba(90,50,20,.5)}
.last.from{width:calc(var(--u)*.36);height:calc(var(--u)*.36)}

/* ── octagonal prism pieces ── */
.pc{--s:calc(var(--u)*.88);position:absolute;width:var(--s);height:var(--s);transform:translate(-50%,-54%);transition:left .28s cubic-bezier(.3,.7,.3,1),top .28s cubic-bezier(.3,.7,.3,1),transform .15s;filter:drop-shadow(0 calc(var(--s)*.07) calc(var(--s)*.05) rgba(20,8,0,.5));z-index:2}
.pc.szL{--s:calc(var(--u)*1.0)} .pc.szS{--s:calc(var(--u)*.74)}
.pc i{position:absolute;display:block;clip-path:polygon(29.3% 0,70.7% 0,100% 29.3%,100% 70.7%,70.7% 100%,29.3% 100%,0 70.7%,0 29.3%)}
.pc .sd{left:0;right:0;top:10%;bottom:0;background:linear-gradient(180deg,#a36d38,#6e4520 70%,#553416)}
.pc .fc{left:0;right:0;top:0;bottom:10%;background:linear-gradient(160deg,#fff2d4 0%,#ecd0a0 35%,#d8b27a 80%,#c89c62 100%)}
.pc .rg{left:6.5%;right:6.5%;top:6%;bottom:16%;opacity:.8}
.pc .in{left:9.5%;right:9.5%;top:8.8%;bottom:18.8%;background:radial-gradient(ellipse at 40% 30%,#fbecca,#ebcd98 70%,#dfbd85)}
.pc.han .rg{background:var(--han-ink)} .pc.cho .rg{background:var(--cho-ink)}
.pc b{position:absolute;inset:0 0 10% 0;display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1;font-size:calc(var(--s)*.64);text-shadow:0 1px 0 rgba(255,250,235,.55)}
.pc.han b{color:var(--han-ink);font-family:var(--kai)}
.pc.cho b{color:var(--cho-ink)}
.pc.cho b svg path{stroke:currentColor;stroke-width:34;stroke-linejoin:round}
.pc.cho b svg{width:calc(var(--s)*.82);height:calc(var(--s)*.82);filter:drop-shadow(0 1px 0 rgba(255,250,235,.55))}
svg.li{width:1em;height:1em;fill:currentColor;vertical-align:-.14em;display:inline-block}
.pc.rot b{transform:rotate(180deg)}
.pc.sel{transform:translate(-50%,-64%);filter:drop-shadow(0 0 calc(var(--s)*.08) #ffe08a) drop-shadow(0 calc(var(--s)*.16) calc(var(--s)*.1) rgba(20,8,0,.5));z-index:4}
.pc.gone{opacity:0;transform:translate(-50%,-54%) scale(.7);transition:opacity .25s,transform .25s}
.pc.mini{position:relative;--s:22px;transform:none;left:auto;top:auto;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.pc.mini.badge{--s:34px}

#banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;opacity:0;z-index:50}
#banner.show{animation:bn 1.5s ease forwards}
#banner.up{transform:translate(-50%,-50%) rotate(180deg)}
#banner .big{font-family:var(--kai);font-size:calc(var(--u)*1.7);color:#fff3da;text-shadow:0 2px 0 #6b1a12,0 0 calc(var(--u)*.4) rgba(0,0,0,.6);letter-spacing:.08em}
#banner .small{font-family:var(--disp);font-weight:700;font-size:calc(var(--u)*.42);color:#fff3da;background:rgba(40,16,8,.75);padding:2px 14px;border-radius:4px}
@keyframes bn{0%{opacity:0;scale:.85}15%{opacity:1;scale:1}75%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);background:rgba(23,17,12,.88);color:var(--paper);padding:6px 14px;border-radius:6px;font-size:13px;z-index:51;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.show{opacity:1}

/* ── dialogs ── */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,7,4,.62);z-index:20;padding-inline:16px;padding-block:16px;overflow:auto}
.dlg{background:linear-gradient(180deg,#261c14,#1d150f);border:1px solid var(--line);border-radius:10px;max-width:520px;width:100%;padding-block:22px;padding-inline:22px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:auto}
.ttl{display:flex;align-items:center;gap:14px}
.ttl .gl{font-size:46px;line-height:1}
.ttl .gl.h{font-family:var(--kai);color:#e04a3c} .ttl .gl.c{color:#5f8fe0}
.ttl h1{font-family:var(--disp);font-size:22px;margin:0;font-weight:700;text-wrap:balance}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grp{display:flex;flex-direction:column;gap:7px}
.lab{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.seg{display:grid;gap:6px;grid-template-columns:repeat(var(--n,2),1fr)}
.seg button{background:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:9px 6px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25}
.seg button small{font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.seg button[aria-pressed="true"] small{color:#5a3f1c}
.seg .h{font-family:var(--kai);color:#e2584a;font-size:17px} .seg .c{color:#6b98e6;font-size:17px}
.seg button[aria-pressed="true"] .h{color:var(--han-ink)} .seg button[aria-pressed="true"] .c{color:var(--cho-ink)}
@media (max-width:460px){.seg.lv{--n:3!important}}
.desc{font-size:13px;color:var(--paper);background:var(--ink2);border-radius:6px;padding:9px 11px;line-height:1.55}
.desc b{color:var(--gold);font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select{width:100%;background:var(--ink3);color:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;font-size:14px}
details{font-size:13px;color:var(--muted)}
summary{cursor:pointer;color:var(--paper)}
.tw{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:400}
td:first-child{color:var(--paper)}
.note{font-size:12px;line-height:1.55;margin:8px 0 0}
.go{display:flex;gap:8px}
.primary{flex:1;background:var(--gold);color:var(--gold-ink);border:none;border-radius:7px;padding:12px;font-size:16px;font-family:var(--disp);font-weight:700}
.secondary{background:transparent;border:1px solid var(--line);border-radius:7px;padding:12px 16px;font-size:14px}
.res{font-family:var(--disp);font-size:26px;font-weight:700;margin:0}
.res .h{font-family:var(--kai);color:#e04a3c} .res .c{color:#5f8fe0}
.nm .h{font-family:var(--kai);color:#e2584a} .nm .c{color:#6b98e6}
.credit{font-size:11px;color:var(--muted);margin:0;line-height:1.5}
@media (prefers-reduced-motion:reduce){.pc{transition:none}#banner.show{animation-duration:.01s}}
</style>

<script>
/* ══════════════ 장기 엔진 (메인 스레드와 워커가 함께 씀) ══════════════ */
function ENGINE(){
  const K=1,A=2,E=3,H=4,R=5,C=6,Z=7;
  const VAL=[0,0,300,300,500,1300,700,200];
  const MATE=100000, INF=1000000000;
  const ROW=new Int8Array(90), COL=new Int8Array(90);
  for(let i=0;i<90;i++){ROW[i]=(i/9)|0;COL[i]=i%9;}
  const ok=(r,c)=>r>=0&&r<10&&c>=0&&c<9, rc=(r,c)=>r*9+c;
  const PAL=new Int8Array(90);
  for(let r=0;r<10;r++)for(let c=3;c<=5;c++){if(r<=2)PAL[rc(r,c)]=-1;if(r>=7)PAL[rc(r,c)]=1;}
  const DIAG=[],DRAY=[],RAY=[],ONB=[],HOR=[],ELE=[],HATK=[],EATK=[];
  for(let i=0;i<90;i++){DIAG.push([]);DRAY.push([]);HATK.push([]);EATK.push([]);}
  for(const r0 of [0,7]){
    const ce=rc(r0+1,4), cs=[rc(r0,3),rc(r0,5),rc(r0+2,5),rc(r0+2,3)];
    cs.forEach((k,j)=>{const op=cs[(j+2)%4];DIAG[ce].push(k);DIAG[k].push(ce);DRAY[ce].push([k]);DRAY[k].push([ce,op]);});
  }
  const OR=[[-1,0],[1,0],[0,-1],[0,1]];
  for(let i=0;i<90;i++){
    const r=ROW[i],c=COL[i];const rays=[],nb=[],ho=[],el=[];
    for(const [dr,dc] of OR){
      const ray=[];let rr=r+dr,cc=c+dc;while(ok(rr,cc)){ray.push(rc(rr,cc));rr+=dr;cc+=dc;}
      rays.push(ray); if(ray.length)nb.push(ray[0]);
      if(!ok(r+dr,c+dc))continue;
      const leg=rc(r+dr,c+dc);
      const perps=dr?[[0,1],[0,-1]]:[[1,0],[-1,0]];
      for(const [pr,pc] of perps){
        const hr=r+2*dr+pr,hc=c+2*dc+pc;
        if(!ok(hr,hc))continue;
        const hd=rc(hr,hc);ho.push([leg,hd]);
        const er=r+3*dr+2*pr,ec=c+3*dc+2*pc;
        if(ok(er,ec))el.push([leg,hd,rc(er,ec)]);
      }
    }
    RAY.push(rays);ONB.push(nb);HOR.push(ho);ELE.push(el);
  }
  for(let i=0;i<90;i++){for(const [l,d] of HOR[i])HATK[d].push([i,l]);for(const [l,m,d] of ELE[i])EATK[d].push([i,l,m]);}
  const ALLR=[];for(let i=0;i<90;i++)ALLR.push(RAY[i].concat(DRAY[i]));

  let seed=0x9e3779b9;const rnd=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return seed|0;};

function drawGrain(w,h){
  const cv=$('#grain'),dpr=Math.min(2,devicePixelRatio||1);cv.width=w*dpr;cv.height=h*dpr;

  g.fillStyle=bg;g.fillRect(0,0,w,h);
  let s=7;const rn=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<150;i++){
    const y0=rn()*h*1.1-h*.05,a1=rn()*h*.02,f1=.002+rn()*.006,ph=rn()*6.3,a2=rn()*h*.006,f2=.02+rn()*.03,dark=rn()<.62;
    g.strokeStyle=dark?`rgba(112,62,24,${.05+rn()*.13})`:`rgba(250,214,150,${.05+rn()*.12})`;
    g.lineWidth=.4+rn()*(dark?1.8:1.2);g.beginPath();
    for(let x=-4;x<=w+4;x+=4){const y=y0+Math.sin(x*f1+ph)*a1+Math.sin(x*f2+ph*2)*a2;x<0?g.moveTo(x,y):g.lineTo(x,y);}

  }

  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(70,35,10,.28)');g.fillStyle=vg;g.fillRect(0,0,w,h);
}

}

function pieceHTML(p){const sd=p>0?'1':'-1',t=Math.abs(p);return `<i class="sd"></i><i class="fc"></i><i class="rg"></i><i class="in"></i><b>${p<0?liSVG(GLY[sd][t]):GLY[sd][t]}</b>`;}
function miniPiece(p,cls=''){const d=document.createElement('div');d.className=`pc mini ${cls} ${p>0?'han':'cho'}`;d.innerHTML=pieceHTML(p);return d;}
const els=new Map();
function render(){
  const layer=$('#pieces'),seen=new Set(),rot=S.mode==='pvp';
  for(let sq=0;sq<90;sq++){
    const p=eng.b[sq];if(!p)continue;const id=ids[sq];seen.add(id);
    let d=els.get(id);
    if(!d){d=document.createElement('div');d.innerHTML=pieceHTML(p);d.setAttribute('role','img');layer.appendChild(d);els.set(id,d);}
    const t=Math.abs(p);
    d.className=`pc sz${SIZE[t]} ${p>0?'han':'cho'}${rot&&p<0?' rot':''}${sq===sel?' sel':''}`;
    d.setAttribute('aria-label',(p>0?'한 ':'초 ')+NAMEK[t]);
    d.style.left=px(vc(sq));d.style.top=py(vr(sq));d.style.zIndex=sq===sel?30:10+vr(sq);
  }
  for(const [id,d] of els)if(!seen.has(id)){els.delete(id);d.classList.add('gone');setTimeout(()=>d.remove(),260);}
  const mk=[];
  if(last){const f=last>>7,t=last&127;mk.push(`<div class="last from" style="left:${px(vc(f))};top:${py(vr(f))}"></div><div class="last" style="left:${px(vc(t))};top:${py(vr(t))}"></div>`);}
  for(const t of dests)mk.push(`<div class="${eng.b[t]?'cap':'dot'}" style="left:${px(vc(t))};top:${py(vr(t))}"></div>`);
  $('#marks').innerHTML=mk.join('');
  updateBars();
}

/* ── 정보 막대 ── */
function score(s){let v=s>0?1.5:0;for(let i=0;i<90;i++){const p=eng.b[i];if(p*s>0)v+=PTS[Math.abs(p)];}return v;}
function buildBar(el,side){
  const human=isHuman(side),ai=S.mode==='ai';
  el.className='bar '+(side>0?'han':'cho')+(S.mode==='pvp'&&el.id==='barTop'?' flip':'');
  const role=ai?(human?'나':'AI · '+LEVELS[S.lvl].name):'플레이어';
  el.innerHTML=`<div class="who"><span class="bdg"></span><div class="meta"><span class="nm">${side>0?'<span class="h">漢</span> 한':'<span class="c">'+liSVG('楚')+'</span> 초'}<small>${role}</small></span><span class="sc"></span></div><div class="tray"></div></div><span class="chip"></span><div class="btns"></div>`;
  el.querySelector('.bdg').replaceWith(miniPiece(side*K,'badge'));
  const bt=el.querySelector('.btns');
  const mkB=(label,fn,key)=>{const b=document.createElement('button');b.className='btn';b.textContent=label;b.dataset.k=key;b.onclick=()=>fn(side);bt.appendChild(b);};
  if(human){mkB('한수 쉼',humanPass,'pass');mkB('무르기',undo,'undo');mkB('기권',resign,'resign');}
  if(el.id==='barBot')mkB('설정',openMenu,'menu');
  el.dataset.side=side;
}
function updateBars(){
  for(const el of [$('#barTop'),$('#barBot')]){
    const side=+el.dataset.side;if(!side)continue;
    const turn=eng.stm===side&&!over;
    el.classList.toggle('turn',turn);el.classList.toggle('think',turn&&busy);
    el.querySelector('.chip').textContent=turn?(busy?'생각 중…':(eng.inCheck(side)?'장군 받음':'차례')):'';
    el.querySelector('.sc').textContent=score(side).toFixed(1)+'점';
    const tray=el.querySelector('.tray');tray.innerHTML='';
    hist.forEach(hh=>{if(hh.cap&&hh.side===side)tray.appendChild(miniPiece(hh.cap));});
    el.querySelectorAll('.btn').forEach(b=>{
      const k=b.dataset.k;
      if(k==='pass')b.disabled=!turn||busy||eng.inCheck(side);
      else if(k==='undo')b.disabled=!hist.length||(S.mode==='ai'&&!hist.some(x=>x.side===S.human));
      else if(k==='resign')b.disabled=over;
    });
  }
}

/* ── 알림 ── */
function banner(checkedSide){
  const bn=$('#banner');bn.classList.remove('show','up');void bn.offsetWidth;
  if(S.mode==='pvp'&&checkedSide<0)bn.classList.add('up');
  bn.classList.add('show');
}
let tt=0;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

/* ── 소리 ── */
let ac=null;
function tock(cap){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const n=ac.sampleRate*.06,buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,6);
    const play=(t,f,v)=>{const s=ac.createBufferSource();s.buffer=buf;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=4;const g=ac.createGain();g.gain.value=v;s.connect(bp).connect(g).connect(ac.destination);s.start(ac.currentTime+t);};
    play(0,cap?1300:1700,cap?1.4:1);if(cap)play(.07,900,.8);
  }catch(e){}
}

/* ── 진행 ── */
function applyMove(m,silent){
  const side=eng.stm;
  if(m===0){eng.pass();hist.push({m:0,cap:0,side,ids:null});}
  else{
    const f=m>>7,t=m&127,snap=ids.slice();
    const cap=eng.make(m);ids[t]=ids[f];ids[f]=0;hist.push({m,cap,side,ids:snap});
    if(!silent)tock(cap);
  }
  rep.push(eng.hash);last=m;sel=-1;dests=[];
}
function afterMove(){
  render();
  const s=eng.stm,lm=eng.legalMoves(),ck=eng.inCheck(s);
  if(!lm.length&&ck){return finish(-s,'외통수');}
  if(ck)banner(s);
  const cnt=rep.filter(x=>x===eng.hash).length;
  if(cnt>=3){const hs=score(1),cs=score(-1);return finish(hs>cs?1:-1,`같은 형세가 세 번 나와 점수로 판정했습니다 (한 ${hs.toFixed(1)} : 초 ${cs.toFixed(1)})`);}
  if(!lm.length){toast((s>0?'한':'초')+'은 둘 수가 없어 한 수 쉽니다');setTimeout(()=>{applyMove(0);afterMove();},700);return;}
  if(!isHuman(s))aiTurn();
}
function finish(winner,reason){
  over=true;busy=false;render();
  const w=winner>0?'<span class="h">漢</span> 한 승리':'<span class="c">'+liSVG('楚')+'</span> 초 승리';
  $('#ot').innerHTML=w;
  let who='';if(S.mode==='ai')who=winner===S.human?'이겼습니다. ':'졌습니다. ';
  $('#oDesc').textContent=who+reason+` · 총 ${hist.length}수`;
  setTimeout(()=>{$('#over').hidden=false;},reason==='외통수'?900:300);
}
function humanPass(side){if(over||busy||eng.stm!==side||eng.inCheck(side))return;applyMove(0);toast((side>0?'한':'초')+' 한수 쉼');afterMove();}
function resign(side){if(over)return;cancelAI();finish(-side,(side>0?'한':'초')+'이 기권했습니다');}
function undoOne(){
  const h=hist.pop();if(!h)return;rep.pop();
  if(h.m===0)eng.pass();else{eng.unmake(h.m,h.cap);ids=h.ids;}
}
function undo(){
  if(!hist.length)return;cancelAI();
  if(S.mode==='pvp')undoOne();
  else{undoOne();while(hist.length&&eng.stm!==S.human)undoOne();}
  over=false;$('#over').hidden=true;
  last=hist.length?hist[hist.length-1].m:0;sel=-1;dests=[];
  els.forEach(d=>d.remove());els.clear();render();
  if(!isHuman(eng.stm))aiTurn();
}

/* ── AI ── */
function workerSrc(){return `const EN=(${ENGINE.toString()})();onmessage=e=>{const d=e.data;EN.load(d.board,d.stm);const m=EN.think(d.params,d.rep);postMessage({m,id:d.id});};`;}
function getWorker(){
  if(worker)return worker;
  try{worker=new Worker(URL.createObjectURL(new Blob([workerSrc()],{type:'text/javascript'})));}catch(e){worker=false;}
  return worker;
}
function cancelAI(){if(busy){token++;busy=false;if(worker){worker.terminate();worker=null;}}}
function aiTurn(){
  if(over)return;busy=true;updateBars();
  const id=++token,t0=Date.now(),params=LEVELS[S.lvl];
  const done=m=>{if(id!==token)return;const wait=Math.max(0,550-(Date.now()-t0));
    setTimeout(()=>{if(id!==token)return;busy=false;if(m===-1)return;applyMove(m);afterMove();},wait);};
  const w=getWorker();
  if(w){w.onmessage=e=>done(e.data.m);w.onerror=()=>{worker=null;runLocal();};w.postMessage({board:Array.from(eng.b),stm:eng.stm,rep:rep.slice(),params,id});}
  else runLocal();
  function runLocal(){setTimeout(()=>{const E2=ENGINE();E2.load(Array.from(eng.b),eng.stm);done(E2.think(params,rep));},30);}
}

/* ── 입력 ── */
$('#board').addEventListener('pointerdown',ev=>{
  if(over||busy||!started)return;
  const s=eng.stm;if(!isHuman(s))return;
  const rect=$('#board').getBoundingClientRect(),u=rect.width/9.2;
  const x=(ev.clientX-rect.left)/u-0.6,y=(ev.clientY-rect.top)/u-0.6;
  const c0=Math.round(x),r0=Math.round(y);
  if(c0<0||c0>8||r0<0||r0>9||Math.hypot(x-c0,y-r0)>.55){sel=-1;dests=[];render();return;}
  const r=flip()?9-r0:r0,c=flip()?8-c0:c0,sq=r*9+c;
  if(sel>=0&&dests.includes(sq)){applyMove(sel<<7|sq);afterMove();return;}
  if(eng.b[sq]*s>0){
    if(sel===sq){sel=-1;dests=[];}
    else{sel=sq;dests=eng.legalMoves().filter(m=>m>>7===sq).map(m=>m&127);if(!dests.length&&eng.inCheck(s))toast('장군을 먼저 막아야 합니다');}
  }else{sel=-1;dests=[];}
  render();
});

/* ── 메뉴 ── */
function seg(id,val,on){document.querySelectorAll(`#${id} button`).forEach(b=>{b.setAttribute('aria-pressed',b.dataset.v===String(val));b.onclick=()=>{on(b.dataset.v);refreshMenu();};});}
function refreshMenu(){
  seg('segMode',S.mode,v=>S.mode=v);
  seg('segSide',S.human,v=>S.human=+v);
  seg('segLv',S.lvl,v=>S.lvl=+v);
  $('#gSide').hidden=$('#gLv').hidden=S.mode!=='ai';
  const L=LEVELS[S.lvl];
  $('#lvDesc').innerHTML=`<b>${L.name} · 목표 ${L.rank}</b><br>${L.desc}`;
}
function buildMenu(){
  $('#segLv').innerHTML=LEVELS.map((L,i)=>`<button id="lv${i}" data-v="${i}">${L.name}<small>${L.rank}</small></button>`).join('');
  $('#lvTable').innerHTML='<tr><th>난이도</th><th>목표 기력</th><th>읽는 수</th><th>생각 시간</th><th>따내기 끝까지</th><th>평가</th><th>실수 확률</th></tr>'+
    LEVELS.map(L=>`<tr><td>${L.name}</td><td>${L.rank}</td><td>${L.depth>=12?'시간 내 최대':L.depth+'수'}</td><td>${L.noise?'—':'최대 '+(L.time/1000)+'초'}</td><td>${L.q?'예':'아니오'}</td><td>${L.full?'기물+배치':'기물 점수만'}</td><td>${L.blunder?Math.round(L.blunder*100)+'%':'없음'}</td></tr>`).join('');
  for(const id of ['#setHan','#setCho']){$(id).innerHTML=SETS.map(s=>`<option>${s}</option>`).join('');}
  $('#setHan').value=S.setHan;$('#setCho').value=S.setCho;
  $('#setHan').onchange=e=>S.setHan=e.target.value;$('#setCho').onchange=e=>S.setCho=e.target.value;
  $('#bStart').onclick=()=>{$('#menu').hidden=true;newGame();};
  $('#bResume').onclick=()=>{$('#menu').hidden=true;};
  $('#oAgain').onclick=()=>{$('#over').hidden=true;newGame();};
  $('#oMenu').onclick=()=>{$('#over').hidden=true;openMenu();};
  refreshMenu();
}
function openMenu(){$('#bResume').hidden=!started||over;refreshMenu();$('#menu').hidden=false;}

function setupBars(){
  const top=flip()?1:-1;
  buildBar($('#barTop'),top);buildBar($('#barBot'),-top);
}
function newGame(moves){
  cancelAI();
  eng.load(initialBoard(),-1);
  ids=new Int16Array(90);for(let i=0;i<90;i++)if(eng.b[i])ids[i]=nextId++;
  els.forEach(d=>d.remove());els.clear();
  hist=[];rep=[eng.hash];sel=-1;dests=[];last=0;over=false;started=true;
  setupBars();
  if(moves&&moves.length){for(const m of moves)applyMove(m,true);}
  render();
  const s=eng.stm;
  if(!isHuman(s))aiTurn();
}

/* ── 시작 ── */
function start(data){
  drawLines();buildMenu();
  new ResizeObserver(fit).observe($('#stage'));fit();
  if(data&&data.S){S=Object.assign(S,data.S);buildMenu();newGame(data.moves||[]);$('#menu').hidden=true;if(data.over)afterMove();}
  else{eng.load(initialBoard(),-1);ids=new Int16Array(90);for(let i=0;i<90;i++)if(eng.b[i])ids[i]=nextId++;setupBars();render();}
}
window.claude?.hot?.snapshot?.(()=>({S,moves:started?hist.map(h=>h.m):null}));
const boot=d=>start(d&&d.moves?d:null);
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
